# External check on the live site. Runs on GitHub, outside AWS, so it still works if the server is down.
# A failed run shows in the Actions tab, and GitHub emails the account if its notification settings allow it.
# GitHub can start scheduled runs late, and turns them off after 60 days with no repository activity.
name: Uptime check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/uptime.yml]

permissions: {}

jobs:
  healthz:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check https://ethanjad.me/healthz
        run: curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 20 --retry-all-errors https://ethanjad.me/healthz
